    <!-- P shape -->
    <path d="M292 143
             H365
             C430 143 472 184 472 245
             C472 305 430 347 366 347
             H335
             V417
             H269
             V289
             H358
             C385 289 404 271 404 245
             C404 219 385 201 358 201
             H319
             L292 143Z"
