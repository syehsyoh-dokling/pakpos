<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A3B18A"/>
      <stop offset="100%" stop-color="#6F7F63"/>
    </linearGradient>

    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E7C8A2"/>
      <stop offset="100%" stop-color="#B08968"/>
    </linearGradient>

    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6A28A"/>
