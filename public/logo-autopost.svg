    <!-- Paper plane -->
    <path d="M186 252
             L398 196
             C411 193 421 207 414 218
             L281 379
             C271 391 252 384 252 368
             V286
             L186 263
             C174 259 174 255 186 252Z"
          fill="url(#coral)"/>

    <path d="M252 286
             L414 205
             L297 306
             L252 368Z"
