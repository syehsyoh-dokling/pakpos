    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#4A5759" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#F5F1E8"/>

  <circle cx="110" cy="90" r="70" fill="#D4A5A5" opacity="0.20"/>
  <circle cx="420" cy="400" r="90" fill="#A3B18A" opacity="0.18"/>

  <g filter="url(#softShadow)">
    <!-- A shape -->
    <path d="M104 347
             L205 148
