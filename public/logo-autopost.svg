    <!-- motion lines -->
    <rect x="130" y="352" width="112" height="16" rx="8" fill="#E9B96E" opacity="0.88" transform="rotate(-24 130 352)"/>
    <rect x="156" y="388" width="94" height="16" rx="8" fill="#E9B96E" opacity="0.78" transform="rotate(-24 156 388)"/>
